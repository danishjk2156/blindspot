# Render Blueprint: New > Blueprint, point it at this repo.
services:
  # ── Backend API ──────────────────────────────────────
  - type: web
    name: blindspot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false # paste it in the Render dashboard; never commit it
      - key: FRONTEND_ORIGIN
        value: https://blindspot-frontend.onrender.com
      - key: DEBUG
        value: "0"

  # ── Frontend (Vite static site) ──────────────────────
  - type: web
    name: blindspot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://blindspot-api.onrender.com
